<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>unocss-preset-palette</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }

      .font-display {
        font-family: "Fraunces", Georgia, serif;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .rise {
        animation: rise 0.55s ease both;
      }

      .rise-delay {
        animation: rise 0.75s ease both;
      }

      .paper-wash {
        background-image:
          radial-gradient(ellipse 80% 60% at 10% 20%, rgba(255, 255, 255, 0.55), transparent 55%),
          radial-gradient(ellipse 70% 50% at 90% 80%, rgba(0, 0, 0, 0.04), transparent 50%);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
